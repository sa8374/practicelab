<h1>Мои курсы</h1>
<div class="card">
  <div class="card-title">Создать курс</div>
  <form id="create-form" class="form">
    <label>Название курса
      <input id="f-title" type="text" placeholder="Например, «Основы SQL»" />
    </label>
    <label>Описание
      <textarea id="f-desc" placeholder="Краткое описание курса"></textarea>
    </label>
    <button class="btn" id="f-submit" type="submit">Создать курс</button>
  </form>
</div>
<div id="courses" class="cards"></div>
